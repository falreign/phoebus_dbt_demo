version: 2

models:
  - name: int_guest_activity_daily
    description: One row per guest per gaming day with any gaming, dining (card-swiped), hotel or jackpot activity.
    columns:
      - name: player_id
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [player_id, activity_date]
  - name: int_guest_metric_events
    description: >
      Long table of (player_id, event_date, metric_name, metric_value, prior_value). Every milestone is detected
      from this one table by comparing metric_value / prior_value to a rule threshold.
    columns:
      - name: metric_name
        data_tests: [not_null]
  - name: int_guest_rg_signals
    description: Responsible-gaming signals per guest over the last few gaming days.
    columns:
      - name: player_id
        data_tests: [unique, not_null]
